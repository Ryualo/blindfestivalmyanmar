<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
    <style>
        body { margin: 0; padding: 20px; }
        .test1 {
            width: 100%;
            height: 400px;
            background-image: url(hero-background.jpg);
            background-size: cover;
            background-position: center;
            border: 5px solid red;
            margin-bottom: 20px;
        }
        .test2 {
            width: 100%;
            height: 400px;
            background-image: url('./hero-background.jpg');
            background-size: cover;
            background-position: center;
            border: 5px solid blue;
            margin-bottom: 20px;
        }
        h2 { font-family: sans-serif; }
    </style>
</head>
<body>
    <h2>Test 1: url(hero-background.jpg) - RED BORDER</h2>
    <div class="test1"></div>
    
    <h2>Test 2: url('./hero-background.jpg') - BLUE BORDER</h2>
    <div class="test2"></div>
    
    <h2>Test 3: Direct IMG tag</h2>
    <img src="hero-background.jpg" style="max-width: 100%; border: 5px solid green;">
</body>
</html>
